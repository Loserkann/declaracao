<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenho uma pergunta...</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe6e6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: #d63031;
            font-size: 24px;
            margin-bottom: 30px;
        }

        .botoes {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            height: 60px;
            position: relative;
        }

        button {
            padding: 10px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: bold;
            height: 45px;
            width: 100px;
        }

        #sim {
            background-color: #2ed573;
            color: white;
        }

        #sim:hover {
            transform: scale(1.1);
        }

        #nao {
            background-color: #ff4757;
            color: white;
            /* Removido o absolute daqui para eles começarem lado a lado */
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="container" id="conteudo">
        <h1 id="titulo">Você aceita ser o amor da minha vida?</h1>
        <div class="botoes">
            <button id="sim" onclick="declaracao()">Sim!</button>
            <button id="nao" onmouseover="fugir()" onclick="fugir()" ontouchstart="fugir()">Não</button>
        </div>
    </div>

    <script>
        // Função que faz o botão "Não" fugir do cursor ou do toque
        function fugir() {
            const botaoNao = document.getElementById('nao');
            
            // Define o comportamento como fixo apenas na hora de fugir
            botaoNao.style.position = 'fixed';
            
            // Gera posições aleatórias na tela inteira
            const larguraJanela = window.innerWidth - 120;
            const alturaJanela = window.innerHeight - 60;
            
            const novoX = Math.random() * larguraJanela;
            const novoY = Math.random() * alturaJanela;
            
            botaoNao.style.left = novoX + 'px';
            botaoNao.style.top = novoY + 'px';
        }

        // Função que mostra a declaração quando clica em "Sim"
        function declaracao() {
            const conteudo = document.getElementById('conteudo');
            conteudo.innerHTML = `
                <h1 style="font-size: 32px; animation: pulsar 1s infinite alternate;">❤️ Te Amo! ❤️</h1>
                <p style="font-size: 18px; color: #4b4b4b; line-height: 1.6;">
                    Sabia que escolheria a opção certa! <br>
                    Você é a pessoa mais especial do mundo para mim.
                </p>
            `;
        }
    </script>
</body>
</html>
